<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 330" width="870" height="330" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .frame { fill: #fff; stroke: #000; }
      .node  { fill: #fff; stroke: #000; filter: url(#shadow); }
      .state { fill: #dae8fc; stroke: #6c8ebf; filter: url(#shadow); }
      .flow  { fill: none; stroke: #000; marker-end: url(#arrow); }
      .pass  { fill: none; stroke: #000; stroke-dasharray: 3 3; marker-end: url(#arrow); }
      .title { font-size: 15px; font-weight: bold; }
      .label { font-size: 12px; }
      .sub   { font-size: 11px; font-family: Consolas, Menlo, monospace; }
      .note  { font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <rect width="870" height="330" fill="#fff"/>

  <!-- ===================== Stateless model ===================== -->
  <text class="title" x="187" y="22" text-anchor="middle">Stateless Model</text>
  <rect class="frame" x="10" y="35" width="365" height="285"/>
  <text class="label" x="18" y="51">Application</text>
  <rect class="frame" x="110" y="60" width="200" height="240"/>
  <text class="label" x="232" y="80" text-anchor="middle">Model</text>

  <!-- Inputs -->
  <rect class="node" x="122" y="100" width="82" height="36" rx="4"/>
  <text class="label" x="163" y="115" text-anchor="middle">Input</text>
  <text class="sub" x="163" y="129" text-anchor="middle">past_kv</text>
  <rect class="node" x="216" y="100" width="82" height="36" rx="4"/>
  <text class="label" x="257" y="115" text-anchor="middle">Input</text>
  <text class="sub" x="257" y="129" text-anchor="middle">input_ids</text>

  <!-- Operations -->
  <rect class="node" x="122" y="160" width="176" height="46" rx="7"/>
  <text class="label" x="210" y="187" text-anchor="middle">Model Operations</text>

  <!-- Outputs -->
  <rect class="node" x="122" y="230" width="82" height="36" rx="4"/>
  <text class="label" x="163" y="245" text-anchor="middle">Output</text>
  <text class="sub" x="163" y="259" text-anchor="middle">present_kv</text>
  <rect class="node" x="216" y="230" width="82" height="36" rx="4"/>
  <text class="label" x="257" y="245" text-anchor="middle">Output</text>
  <text class="sub" x="257" y="259" text-anchor="middle">logits</text>

  <!-- Data passing done by the application -->
  <rect class="frame" x="20" y="150" width="80" height="62" rx="6" stroke-dasharray="3 3"/>
  <text class="label" x="60" y="174" text-anchor="middle">KV cache</text>
  <text class="note" x="60" y="190" text-anchor="middle">copied back</text>
  <text class="note" x="60" y="203" text-anchor="middle">by the app</text>

  <path class="flow" d="M 163 136 L 163 159"/>
  <path class="flow" d="M 257 136 L 257 159"/>
  <path class="flow" d="M 163 206 L 163 229"/>
  <path class="flow" d="M 257 206 L 257 229"/>
  <path class="pass" d="M 163 266 L 163 286 L 60 286 L 60 213"/>
  <path class="pass" d="M 60 150 L 60 88 L 163 88 L 163 99"/>

  <!-- In / Out data -->
  <text class="label" x="342" y="60" text-anchor="middle">In Data</text>
  <path class="flow" d="M 337 66 L 290 99"/>
  <path class="flow" d="M 290 266 L 337 296"/>
  <text class="label" x="342" y="310" text-anchor="middle">Out Data</text>

  <g transform="translate(-105,0)">
    <!-- ===================== Stateful model ===================== -->
    <text class="title" x="757" y="22" text-anchor="middle">Stateful Model</text>
    <rect class="frame" x="550" y="35" width="415" height="285"/>
    <text class="label" x="558" y="51">Application</text>
    <rect class="frame" x="565" y="60" width="340" height="240"/>
    <text class="label" x="800" y="80" text-anchor="middle">Model</text>

    <!-- State kept inside the runtime -->
    <rect class="state" x="578" y="155" width="92" height="56" rx="6"/>
    <text class="label" x="624" y="179" text-anchor="middle">Internal</text>
    <text class="label" x="624" y="195" text-anchor="middle">KV cache</text>

    <!-- ReadValue / Input -->
    <rect class="state" x="712" y="100" width="82" height="36" rx="4"/>
    <text class="label" x="753" y="115" text-anchor="middle">ReadValue</text>
    <text class="sub" x="753" y="129" text-anchor="middle">past_kv</text>
    <rect class="node" x="806" y="100" width="82" height="36" rx="4"/>
    <text class="label" x="847" y="115" text-anchor="middle">Input</text>
    <text class="sub" x="847" y="129" text-anchor="middle">input_ids</text>

    <!-- Operations -->
    <rect class="node" x="712" y="160" width="176" height="46" rx="7"/>
    <text class="label" x="800" y="187" text-anchor="middle">Model Operations</text>

    <!-- Assign / Output -->
    <rect class="state" x="712" y="230" width="82" height="36" rx="4"/>
    <text class="label" x="753" y="245" text-anchor="middle">AssignValue</text>
    <text class="sub" x="753" y="259" text-anchor="middle">present_kv</text>
    <rect class="node" x="806" y="230" width="82" height="36" rx="4"/>
    <text class="label" x="847" y="245" text-anchor="middle">Output</text>
    <text class="sub" x="847" y="259" text-anchor="middle">logits</text>

    <path class="flow" d="M 753 136 L 753 159"/>
    <path class="flow" d="M 847 136 L 847 159"/>
    <path class="flow" d="M 753 206 L 753 229"/>
    <path class="flow" d="M 847 206 L 847 229"/>
    <path class="pass" d="M 624 155 L 624 88 L 753 88 L 753 99"/>
    <path class="pass" d="M 753 266 L 753 286 L 624 286 L 624 212"/>

    <!-- In / Out data -->
    <text class="label" x="935" y="60" text-anchor="middle">In Data</text>
    <path class="flow" d="M 930 66 L 880 99"/>
    <path class="flow" d="M 880 266 L 930 296"/>
    <text class="label" x="935" y="310" text-anchor="middle">Out Data</text>
  </g>
</svg>
