<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 292" width="1075" height="292" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <style>
      .node  { fill: #fff; stroke: #000; filter: url(#shadow); }
      .api   { fill: #dae8fc; stroke: #6c8ebf; filter: url(#shadow); }
      .impl  { fill: #d5e8d4; stroke: #82b366; filter: url(#shadow); }
      .flow  { fill: none; stroke: #000; marker-end: url(#arrow); }
      .group { font-size: 13px; font-weight: bold; }
      .label { font-size: 12px; }
      .sub   { font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <rect width="1075" height="292" fill="#fff"/>

  <!-- ===================== Dynamic LM Challenges ===================== -->
  <text class="group" x="10" y="32">Dynamic LM</text>
  <text class="group" x="10" y="48">Challenges</text>

  <rect class="node" x="140" y="10" width="220" height="52"/>
  <text class="label" x="250" y="32" text-anchor="middle">Dynamic prompt length</text>
  <text class="sub" x="250" y="50" text-anchor="middle">prompt length varies at runtime</text>

  <rect class="node" x="375" y="10" width="220" height="52"/>
  <text class="label" x="485" y="32" text-anchor="middle">Usage intent</text>
  <text class="sub" x="485" y="50" text-anchor="middle">needed by compilation</text>

  <rect class="node" x="845" y="10" width="220" height="52"/>
  <text class="label" x="955" y="32" text-anchor="middle">Growing decode KV cache</text>
  <text class="sub" x="955" y="50" text-anchor="middle">cache grows every decode step</text>

  <rect class="node" x="610" y="10" width="220" height="52"/>
  <text class="label" x="720" y="32" text-anchor="middle">LM-specific operators</text>
  <text class="sub" x="720" y="50" text-anchor="middle">Attention · RoPE · Norm · MatMulNBits</text>

  <!-- ===================== WebNN proposals ===================== -->
  <text class="group" x="10" y="142">WebNN</text>
  <text class="group" x="10" y="158">proposals</text>

  <rect class="api" x="140" y="120" width="220" height="52"/>
  <text class="label" x="250" y="142" text-anchor="middle">Flexible input shapes</text>
  <text class="sub" x="250" y="160" text-anchor="middle">dynamic dimensions</text>

  <rect class="api" x="375" y="120" width="220" height="52"/>
  <text class="label" x="485" y="142" text-anchor="middle">Build-time metadata</text>
  <text class="sub" x="485" y="160" text-anchor="middle">usage hints for compilation</text>

  <rect class="api" x="845" y="120" width="220" height="52"/>
  <text class="label" x="955" y="142" text-anchor="middle">Stateful model</text>
  <text class="sub" x="955" y="160" text-anchor="middle">state across executions</text>

  <rect class="api" x="610" y="120" width="220" height="52"/>
  <text class="label" x="720" y="142" text-anchor="middle">Composite operators and subgraphs</text>
  <text class="sub" x="720" y="160" text-anchor="middle">portable LM patterns</text>

  <!-- ===================== OpenVINO NPU optimization ===================== -->
  <text class="group" x="10" y="252">OpenVINO NPU</text>
  <text class="group" x="10" y="268">optimization</text>

  <!-- Spans the first two columns: fed by both flexible shapes and metadata -->
  <rect class="impl" x="140" y="230" width="455" height="52"/>
  <text class="label" x="367.5" y="252" text-anchor="middle">Static decomposition</text>
  <text class="sub" x="367.5" y="270" text-anchor="middle">NPU-friendly static execution</text>

  <rect class="impl" x="845" y="230" width="220" height="52"/>
  <text class="label" x="955" y="252" text-anchor="middle">KV cache management</text>
  <text class="sub" x="955" y="270" text-anchor="middle">preallocated, device-resident cache</text>

  <rect class="impl" x="610" y="230" width="220" height="52"/>
  <text class="label" x="720" y="252" text-anchor="middle">Pattern matching and fusion</text>
  <text class="sub" x="720" y="270" text-anchor="middle">LM ops recovered from primitives</text>

  <!-- ===================== Arrows ===================== -->
  <path class="flow" d="M 250 62 L 250 119"/>
  <path class="flow" d="M 485 62 L 485 119"/>
  <path class="flow" d="M 720 62 L 720 119"/>
  <path class="flow" d="M 955 62 L 955 119"/>

  <path class="flow" d="M 250 172 L 250 229"/>
  <path class="flow" d="M 485 172 L 485 229"/>
  <path class="flow" d="M 720 172 L 720 229"/>
  <path class="flow" d="M 955 172 L 955 229"/>
</svg>
